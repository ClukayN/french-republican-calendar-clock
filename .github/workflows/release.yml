name: Build and publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: 编译 Windows 桌面版
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 用 csc.exe 编译
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.0.$($env:GITHUB_RUN_NUMBER)"
          }
          ./build.ps1 -Version $v
          Get-ChildItem dist | Format-Table Name, Length

      - name: 生成发布用的 ASCII 文件名
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $asset = "french-republican-calendar-clock-$tag.exe"
          Copy-Item 'dist\法国共和历.exe' "build\$asset"
          "EXE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 创建或更新 Release 并上传 exe
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes --latest
          }
          gh release upload $tag "build\$env:EXE_ASSET" --clobber

      - name: 手动触发时留档
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ github.sha }}
          path: build/*.exe
          retention-days: 14

  android:
    name: 编译 Android 版
    runs-on: windows-latest
    needs: desktop

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 找到 python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Get-Command python -ErrorAction SilentlyContinue)
          if (-not $py) { throw '找不到 python' }
          "PYBIN=$($py.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $py.Source --version

      - name: 打包 APK
        shell: pwsh
        env:
          RC_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RC_KEYSTORE_B64) {
            Write-Warning '没有配置 ANDROID_KEYSTORE_B64，将临时生成签名密钥（这样每次发布的签名都不同，旧版本无法覆盖安装）'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $name = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $name = "0.0.$($env:GITHUB_RUN_NUMBER)"
          }
          ./android/build_apk.ps1 -VersionName $name -VersionCode $env:GITHUB_RUN_NUMBER
          Get-ChildItem android/dist | Format-Table Name, Length

      - name: 生成发布用的 ASCII 文件名
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $asset = "french-republican-calendar-clock-$tag.apk"
          Copy-Item 'android\dist\法国共和历.apk' "android\build\$asset"
          "APK_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 上传 APK 到 Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          gh release upload $tag "android\build\$env:APK_ASSET" --clobber
          gh release view $tag --json name,assets

      - name: 手动触发时留档
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: android/build/*.apk
          retention-days: 14
